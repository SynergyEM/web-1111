<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11/11</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at 20% 30%, rgba(130, 80, 255, 0.35), transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(255, 100, 200, 0.25), transparent 25%),
        radial-gradient(circle at 50% 70%, rgba(90, 180, 255, 0.25), transparent 30%),
        radial-gradient(circle at 30% 80%, rgba(255, 255, 255, 0.08), transparent 20%),
        linear-gradient(135deg, #090114, #120424, #1f0b3a, #080012);
      color: white;
      position: relative;
    }

    /* Estrellas */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image:
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1.5px 1.5px at 100px 120px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.8px 1.8px at 200px 80px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.2px 1.2px at 300px 200px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 400px 150px, rgba(255,255,255,0.9), transparent);
      background-size: 450px 450px;
      animation: moveStars 60s linear infinite;
      opacity: 0.6;
      z-index: 0;
    }

    body::after {
      animation-duration: 90s;
      opacity: 0.35;
    }

    @keyframes moveStars {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(120px, 80px);
      }
    }

    .container {
      text-align: center;
      z-index: 1;
      padding: 20px;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 700;
      letter-spacing: 4px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.6),
        0 0 20px rgba(180,120,255,0.6),
        0 0 40px rgba(120,180,255,0.4);
      margin-bottom: 20px;
    }

    p {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2rem, 5vw, 4rem);
      color: #ffd6f5;
      text-shadow:
        0 0 8px rgba(255,255,255,0.4),
        0 0 16px rgba(255,160,230,0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>11/11</h1>
    <p>Siempre te deseo</p>
  </div>
</body>
</html>
